# Theme colors: $color, $inner_color, $outer_color, $font_color, $check_color
source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
    hide_cursor = true
    grace = 0
}

# Blurred wallpaper backdrop
background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 5, easeOutQuint
    animation = inputFieldDots, 1, 2, linear
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 130
    font_family = CaskaydiaMono Nerd Font ExtraBold
    color = $font_color
    position = 0, 230
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0,0,0,0.6)
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 24
    font_family = CaskaydiaMono Nerd Font
    color = $font_color
    position = 0, 120
    halign = center
    valign = center
}

# Time-of-day greeting
label {
    monitor =
    text = cmd[update:60000] h=$(date +%H); if [ "$h" -lt 12 ]; then echo " Good morning, $(whoami)"; elif [ "$h" -lt 18 ]; then echo " Good afternoon, $(whoami)"; else echo " Good evening, $(whoami)"; fi
    font_size = 17
    font_family = CaskaydiaMono Nerd Font
    color = rgba(255, 206, 173, 0.65)
    position = 0, 20
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 380, 60
    position = 0, -80
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 3
    rounding = 18

    font_family = CaskaydiaMono Nerd Font Propo
    font_color = $font_color

    placeholder_text = <i>󰌾  Enter password</i>
    check_color = $check_color
    fail_text = <i>󰗖  $FAIL (attempt $ATTEMPTS)</i>

    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0,0,0,0.5)
    fade_on_empty = false
}

# Now playing (auto-hides when no player / nothing playing)
label {
    monitor =
    text = cmd[update:2000] $HOME/.local/bin/hyprlock-nowplaying
    font_size = 15
    font_family = CaskaydiaMono Nerd Font
    color = rgba(125, 130, 217, 0.85)
    position = 0, -185
    halign = center
    valign = center
}

auth {
    fingerprint:enabled = true
}
