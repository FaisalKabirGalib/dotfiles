# Application bindings
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser
$mainMod = SUPER

bindd = SUPER, return, Terminal, exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
# bindd = SUPER, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser (private), exec, $browser --private
bindd = SUPER, N, Editor, exec, omarchy-launch-editor
bindd = SUPER, T, Activity, exec, $terminal -e btop
bindd = SUPER, D, Docker, exec, $terminal -e lazydocker
bindd = SUPER, G, Signal, exec, omarchy-launch-or-focus signal "uwsm app -- signal-desktop"
bindd = SUPER, O, Obsidian, exec, omarchy-launch-or-focus obsidian "uwsm app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER, E, Files, exec, uwsm app -- nemo

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
# bindd = SUPER, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER, Y, YouTube, exec, omarchy-launch-or-focus-webapp YouTube "https://youtube.com/"
bindd = SUPER SHIFT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER ALT, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu


# Move focus like vim motion
bindd = Ctrl+Super, h, Move focus left, movefocus, l
bindd = Ctrl+Super, l, Move focus right, movefocus, r
bindd = Ctrl+Super, k, Move focus up, movefocus, u
bindd = Ctrl+Super, j, Move focus down, movefocus, d

# Workspace bindings - Super + 1-0 for workspaces 1-10
binddi = SUPER, 1, Workspace 1, workspace, 1
binddi = SUPER, 2, Workspace 2, workspace, 2
binddi = SUPER, 3, Workspace 3, workspace, 3
binddi = SUPER, 4, Workspace 4, workspace, 4
binddi = SUPER, 5, Workspace 5, workspace, 5
binddi = SUPER, 6, Workspace 6, workspace, 6
binddi = SUPER, 7, Workspace 7, workspace, 7
binddi = SUPER, 8, Workspace 8, workspace, 8
binddi = SUPER, 9, Workspace 9, workspace, 9
binddi = SUPER, 0, Workspace 10, workspace, 10

# Ctrl + 1-0 for workspaces 11-20
binddi = Ctrl, 1, Workspace 11, workspace, 11
binddi = Ctrl, 2, Workspace 12, workspace, 12
binddi = Ctrl, 3, Workspace 13, workspace, 13
binddi = Ctrl, 4, Workspace 14, workspace, 14
binddi = Ctrl, 5, Workspace 15, workspace, 15
binddi = Ctrl, 6, Workspace 16, workspace, 16
binddi = Ctrl, 7, Workspace 17, workspace, 17
binddi = Ctrl, 8, Workspace 18, workspace, 18
binddi = Ctrl, 9, Workspace 19, workspace, 19
binddi = Ctrl, 0, Workspace 20, workspace, 20

# Move active window to workspace - Super + Shift + 1-0 for workspaces 1-10
binddi = SUPER SHIFT, 1, Move to workspace 1, movetoworkspace, 1
binddi = SUPER SHIFT, 2, Move to workspace 2, movetoworkspace, 2
binddi = SUPER SHIFT, 3, Move to workspace 3, movetoworkspace, 3
binddi = SUPER SHIFT, 4, Move to workspace 4, movetoworkspace, 4
binddi = SUPER SHIFT, 5, Move to workspace 5, movetoworkspace, 5
binddi = SUPER SHIFT, 6, Move to workspace 6, movetoworkspace, 6
binddi = SUPER SHIFT, 7, Move to workspace 7, movetoworkspace, 7
binddi = SUPER SHIFT, 8, Move to workspace 8, movetoworkspace, 8
binddi = SUPER SHIFT, 9, Move to workspace 9, movetoworkspace, 9
binddi = SUPER SHIFT, 0, Move to workspace 10, movetoworkspace, 10

# Ctrl + Shift + 1-0 for workspaces 11-20
binddi = Ctrl SHIFT, 1, Move to workspace 11, movetoworkspace, 11
binddi = Ctrl SHIFT, 2, Move to workspace 12, movetoworkspace, 12
binddi = Ctrl SHIFT, 3, Move to workspace 13, movetoworkspace, 13
binddi = Ctrl SHIFT, 4, Move to workspace 14, movetoworkspace, 14
binddi = Ctrl SHIFT, 5, Move to workspace 15, movetoworkspace, 15
binddi = Ctrl SHIFT, 6, Move to workspace 16, movetoworkspace, 16
binddi = Ctrl SHIFT, 7, Move to workspace 17, movetoworkspace, 17
binddi = Ctrl SHIFT, 8, Move to workspace 18, movetoworkspace, 18
binddi = Ctrl SHIFT, 9, Move to workspace 19, movetoworkspace, 19
binddi = Ctrl SHIFT, 0, Move to workspace 20, movetoworkspace, 20

bindd = $mainMod, R, Reload config, exec, hyprctl reload; killall ags ydotool; ags &
bindd = $mainMod, M, Toggle fullscreen, fullscreen, 0
bindd = $mainMod, F, Toggle floating, togglefloating,
bindd = $mainMod, V, Toggle pseudo (split), togglespecialworkspace, magic
bindd = $mainMod, P, Pin window, pin,

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindd = $mainMod, Q, Kill active window, killactive,
bindd = $mainMod Shift Alt, Q, Pick and kill window, exec, hyprctl kill

# Rebind external workspaces (use when switching monitors)
bindd = $mainMod Alt, W, Rebind external workspaces, exec, ~/.config/hypr/scripts/setup-external-workspaces.sh

# Rebind external workspaces (use when switching monitors)
bindd = $mainMod ALT, W, Rebind external workspaces, exec, ~/.config/hypr/scripts/setup-external-workspaces.sh
