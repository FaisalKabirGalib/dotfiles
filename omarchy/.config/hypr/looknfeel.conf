# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows
    # gaps_in = 0
    # gaps_out = 0

    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    # When a window is fullscreen, other windows stay behind it (not replaced)
    # 0 = no special behavior
    # 1 = new window takes focus, exits fullscreen
    # 2 = new window goes behind fullscreen (stays maximized in background)
    # 3 = new window takes focus, fullscreen stays
   #  new_window_takes_over_fullscreen = 2
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
     rounding = 8
}

# https://wiki.hypr.land/Configuring/Dwindle-Layout/
dwindle {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# Window rules for floating windows
# Set default size for floating windows to 80% of screen size, centered
windowrulev2 = size 80% 80%, floating:1
windowrulev2 = center, floating:1
