# Change the default Omarchy look'n'feel
# Sourced LAST in hyprland.conf, so everything here overrides Omarchy defaults.
# Tuned for the Ethereal theme (peach #ffcead on deep navy, indigo accent #7d82d9).

# Theme-matched accent colors (reused below)
$accent      = rgba(7d82d9ff)
$accentSoft  = rgba(7d82d9aa)
$peach       = rgba(ffceadff)
$dimBorder   = rgba(3c486d66)

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in  = 4
    gaps_out = 8
    border_size = 2

    # Peach -> indigo diagonal gradient on the focused window
    col.active_border = $peach $accent 45deg
    col.inactive_border = $dimBorder

    resize_on_border = true
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # The focused window is fully opaque; everything else is gently translucent.
    active_opacity   = 1.0
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0

    # Dim unfocused windows so the active one pops
    dim_inactive = true
    dim_strength = 0.08

    # Frosted-glass blur (kept modest for battery)
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.015
        contrast = 1.0
        brightness = 0.9
        vibrancy = 0.18
        vibrancy_darkness = 0.05
    }

    # Soft drop shadow tinted with the accent
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(060b1ecc)
        color_inactive = rgba(060b1e88)
    }
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    # When a window is fullscreen, other windows stay behind it (not replaced)
    # new_window_takes_over_fullscreen = 2
}

# https://wiki.hypr.land/Configuring/Advanced-and-Cool/Animations/
animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeOutExpo,  0.16, 1, 0.3, 1
    bezier = overshot,     0.05, 0.9, 0.1, 1.05
    bezier = snappy,       0.4, 0, 0.2, 1
    bezier = smoothOut,    0.36, 0, 0.66, -0.56

    animation = windows,     1, 4, overshot, popin 60%
    animation = windowsIn,   1, 4, overshot, popin 60%
    animation = windowsOut,  1, 3, smoothOut, popin 70%
    animation = windowsMove, 1, 4, snappy
    animation = border,      1, 8, default
    animation = fade,        1, 4, snappy
    animation = fadeIn,      1, 4, snappy
    animation = fadeOut,     1, 3, smoothOut
    animation = workspaces,  1, 5, overshot, slidefade 15%
    animation = specialWorkspace, 1, 5, overshot, slidefadevert 15%
    animation = layers,      1, 3, snappy, slide

    # Animated rotating gradient border = signature "hall of fame" look, but it
    # repaints continuously and will drain a laptop battery. So it's OFF by
    # default; toggle at runtime with SUPER+ALT+B (toggle-border-anim script).
    # The `linear` bezier is defined here so the toggle can register the loop.
    bezier = linear, 0, 0, 1, 1
    # animation = borderangle, 1, 50, linear, loop   # toggled live, not set here
}

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # single_window_aspect_ratio = 1 1
}

# Blur the launcher and notification surfaces for the frosted-glass look
layerrule = blur on, match:namespace walker
layerrule = blur on, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window
layerrule = blur on, match:namespace logout_dialog

# Floating cava visualizer (SUPER+ALT+V) — centered, fixed size
windowrule = float on, match:class ^(cava\.visualizer)$
windowrule = size 900 360, match:class ^(cava\.visualizer)$
windowrule = center on, match:class ^(cava\.visualizer)$
