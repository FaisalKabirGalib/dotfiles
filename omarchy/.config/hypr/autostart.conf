# Extra autostart processes
exec-once = ~/.config/hypr/scripts/setup-external-workspaces.sh

# Use swaync instead of Omarchy's default mako (mako is started by the read-only
# defaults; stop it and launch swaync). Revert: remove this line, then `pkill swaync; mako`.
exec-once = sh -c 'sleep 0.5; pkill -x mako; swaync'

# Auto-start apps on specific workspaces
exec-once = [workspace 11 silent] ghostty -e tmux new -A -s Home
exec-once = [workspace 12 silent] zen-browser
