id = "pj"
name = "pj"
version = "0.2.0-local"
min_herdr_version = "0.7.4"
description = "Project jumper — fuzzy-find pj projects and open them as Herdr workspaces"
platforms = ["linux"]

[[panes]]
id = "picker"
title = "Projects"
placement = "popup"
width = "80%"
height = "80%"
command = ["bash", "-lc", "$HERDR_PLUGIN_ROOT/scripts/pj-picker.sh"]

[[actions]]
id = "open-picker"
title = "Open project picker"
contexts = ["workspace"]
command = ["bash", "-c", "$HERDR_BIN_PATH plugin pane open --plugin pj --entrypoint picker --placement popup --focus"]
