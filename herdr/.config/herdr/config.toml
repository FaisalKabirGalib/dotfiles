onboarding = false

[theme]
name = "terminal"

[theme.custom]
panel_bg = "#1e1e2e"

[terminal]
default_shell = "/usr/bin/zsh"
shell_mode = "login"
new_cwd = "follow"

[keys]
prefix = "ctrl+space"
help = "prefix+?"
settings = "prefix+shift+s"
detach = "prefix+d"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "Vim-aware pane down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "Vim-aware pane up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "Vim-aware pane right"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "Vim-aware resize left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "Vim-aware resize down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "Vim-aware resize up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "Vim-aware resize right"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "sd2k.thumbs.pick"
description = "Hint-pick text on screen"

[[keys.command]]
key = "prefix+p"
type = "popup"
command = "exec /usr/bin/zsh -l"
description = "scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "herdr-nvim.toggle"
description = "toggle Neovim sidebar"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "cmc.plugins.open"
description = "manage plugins"

[ui]
accent = "blue"
sidebar_start_collapsed = false
sidebar_collapsed_mode = "compact"
pane_gaps = false
pane_outer_borders = false
show_agent_labels_on_pane_borders = true
pane_scrollbars = true
confirm_close = true
prompt_new_tab_name = false
mouse_capture = true
copy_on_select = false
tab_bar_position = "top"
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]
window_title = "{hostname}: {workspace}"
status_indicators = "symbols"

[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[worktrees]
directory = "~/Dev/herdr-worktrees"

[advanced]
scrollback_limit_bytes = 20000000

[experimental]
kitty_graphics = true
pane_history = false
