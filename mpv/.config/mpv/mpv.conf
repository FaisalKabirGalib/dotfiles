# GPU output (gpu-next = mpv's recommended driver) + hardware decode.
# This machine is Intel Iris Xe (TigerLake-LP GT2), so decoding goes through
# VA-API. `vaapi` keeps frames on the GPU; use `vaapi-copy` only if a filter
# chain needs them back in system memory.
vo=gpu-next
hwdec=vaapi

# Up-to-8K (4320p). Prefer VP9 so Tiger Lake's hardware VP9 decoder engages
# (its AV1 support is patchier). Falls back to any codec, then any format.
ytdl-format="bestvideo[vcodec^=vp9][height<=4320]+bestaudio/best/bestvideo[height<=4320]+bestaudio/best"

# Only if high-resolution playback stutters, uncomment — trades quality for
# throughput.
# profile=fast
