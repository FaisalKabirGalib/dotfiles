# GPU output (gpu-next = mpv's recommended driver with videotoolbox) + hw decode.
vo=gpu-next
hwdec=videotoolbox

# Up-to-8K (4320p). Prefer VP9 so the M2's hardware VP9 decoder engages (AV1 is
# CPU-only on M2). Falls back to any codec, then any format, if VP9 unavailable.
ytdl-format="bestvideo[vcodec^=vp9][height<=4320]+bestaudio/best/bestvideo[height<=4320]+bestaudio/best"

# ponytail: only if 8K stutters, uncomment — trades quality for throughput.
# profile=fast
