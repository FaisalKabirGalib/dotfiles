[policy]
name = "Sensitive Files Protection"
description = "Requires user confirmation before modifying sensitive configuration files."
priority = "user"

[[rules]]
action = "ask"
resource = "file"
pattern = "**/\\.ssh/config"

[[rules]]
action = "ask"
resource = "file"
pattern = "**/\\.env*"

[[rules]]
action = "ask"
resource = "file"
pattern = "**/.git/config"

[[rules]]
action = "ask"
resource = "file"
pattern = "**/credentials*"
