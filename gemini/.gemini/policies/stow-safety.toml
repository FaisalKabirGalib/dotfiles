[policy]
name = "Stow Symlink Safety"
description = "Ensures agent uses safe writing methods for symlinked dotfiles as per AGENTS.md."
priority = "workspace"

[[rules]]
action = "allow"
resource = "shell_command"
pattern = "cat > * << 'EOF'*"

[[rules]]
action = "ask"
resource = "tool"
pattern = "write_file"
condition = "file_is_symlink(path)"

[[rules]]
action = "ask"
resource = "tool"
pattern = "replace"
condition = "file_is_symlink(path)"
