profiles:
  base:
    - context7
  flutter:
    - dart-mcp-server: local, Dart 3.9+
  expo:
    - expo-mcp: remote OAuth, project-scoped
  next:
    - drizzle-kit-mcp: local, only when Drizzle is installed
    - prisma-mcp: local, only when Prisma is installed
  nestjs:
    - drizzle-kit-mcp: local, only when Drizzle is installed
    - prisma-mcp: local, only when Prisma is installed
  postgres:
    - drizzle-kit-mcp: local, only when Drizzle is installed
    - prisma-mcp: local, only when Prisma is installed
  drizzle:
    - drizzle-kit-mcp: local, only when Drizzle is installed
  prisma:
    - prisma-mcp: local, only when Prisma is installed; do not use remote Prisma Postgres MCP for project-owned PostgreSQL
  docker:
    - docker-mcp-toolkit: manual, Docker Desktop only
  vercel:
    - vercel-mcp: remote OAuth, only for Vercel deployments
  supabase:
    - supabase-mcp: remote OAuth, project-scoped and read-only first
  web-design:
    - agent-browser: local, UI verification only
  knowledge-graph:
    - graphify: manual, only for mixed code and non-code knowledge bases
