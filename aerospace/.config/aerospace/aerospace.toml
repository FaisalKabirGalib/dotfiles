# AeroSpace config, mirroring the keybinding philosophy of this dotfiles
# repo's Hyprland config (omarchy branch: hyprland/.config/hypr/*.conf).
#
# IMPORTANT: AeroSpace checks ~/.aerospace.toml FIRST, and only falls back
# to this XDG path (~/.config/aerospace/aerospace.toml) if that file
# doesn't exist. If AeroSpace's own onboarding already copied a default
# config to ~/.aerospace.toml, delete it or this file will be silently
# ignored.
#
# NOT ported from Hyprland (no AeroSpace/macOS equivalent -- AeroSpace is
# accessibility-API-based like yabai, not a compositor):
#   - borders, rounding, blur, shadows, opacity, animations
#   - Omarchy's dynamic theme-switching (source = ~/.config/omarchy/current/theme/...)
#   - Walker (app launcher)      -> Raycast / Spotlight instead
#   - Waybar (status bar)        -> native macOS menu bar
#   - hypridle / hyprlock        -> native macOS sleep/lock (System Settings)
#   - hyprsunset                 -> native Night Shift
# Gaps DO have a real AeroSpace equivalent and are ported below.

config-version = 2
start-at-login = true

default-root-container-layout = 'tiles'

# Instant feedback for the sketchybar workspace overview on a workspace
# switch (its own 2s poll otherwise still catches window open/close). See
# dotfiles sketchybar/PACKAGE.md. FOCUSED_WORKSPACE must be forwarded --
# items/spaces.lua's aerospace_workspace_change subscriber reads
# env.FOCUSED_WORKSPACE to decide which item to highlight.
exec-on-workspace-change = ['/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE']

# Trigger sketchybar updates instantly on window focus changes
on-focus-changed = ['exec-and-forget sketchybar --trigger aerospace_focus_change']

# Autostart: workspace 1 gets ghostty+tmux, workspace 2 gets zen-browser.
after-startup-command = [
  'workspace 1',
  'exec-and-forget open -a Ghostty -n --args -e tmux new -A -s Home',
  'workspace 2',
  'exec-and-forget open -a Zen',
  'workspace 1',
]

[gaps]
inner.horizontal = 4
inner.vertical = 4
outer.left = 8
outer.right = 8
# sketchybar's bar height is 32px (sketchybar/.config/sketchybar/bar.lua) --
# outer.top must clear that or windows render underneath/behind the bar.
outer.top = 40
outer.bottom = 8

# SUPER (the Hyprland mod key) maps to Cmd on macOS. Final scheme, settled
# after iterating on an AeroSpace/tmux conflict (AeroSpace is OS-level and
# always wins the key-event race, so any binding it claims never reaches
# the terminal). Dual-monitor split (see [workspace-to-monitor-force-assignment]
# at the bottom): the PRIMARY monitor owns workspaces 1-10, the EXTERNAL
# (BenQ) owns 11-20, mirroring the laptop's old Hyprland eDP-1/external split.
#   - `cmd`  is the primary mod: window management (focus/move/resize/close/
#     launchers) AND workspaces 1-10 (cmd-1..0 switch, cmd-shift-1..0 move).
#   - `ctrl` owns the external monitor: workspaces 11-20 (ctrl-1..0 switch,
#     ctrl-shift-1..0 move). ctrl-shift-hjkl is in-tree window movement.
#   - bare `ctrl-hjkl` is deliberately left UNBOUND so it stays fully free
#     for tmux's vim-tmux-navigator pane navigation.
# This is a known, accepted tradeoff -- `cmd` as primary overrides several
# common macOS/app shortcuts system-wide (AeroSpace intercepts before the
# app ever sees the key):
#   - cmd-q (close) overrides Quit Application
#   - cmd-m (fullscreen) overrides Minimize to Dock
#   - cmd-f (floating toggle) overrides Find
#   - cmd-h (focus left) overrides Hide Application
#   - cmd-b (Zen launcher) overrides Bold in text-editing contexts
#   - cmd-shift-r (reload-config) overrides hard-refresh in browsers
[mode.main.binding]

# Vim-motion focus navigation
cmd-h = 'focus left'
cmd-j = 'focus down'
cmd-k = 'focus up'
cmd-l = 'focus right'

# In-tree window reposition -- NEW, no Hyprland source equivalent (dwindle
# auto-splits instead), but genuinely useful in AeroSpace's tiling model.
# NOTE: this is a different command from move-node-to-workspace below,
# despite the similar name -- this moves within the current workspace's
# tree, that one sends the window to a different workspace entirely.
# ctrl-shift, pairing with ctrl-shift-1..0 below under one "move" namespace
# -- bare ctrl-hjkl is deliberately unbound, see note above re: tmux.
ctrl-shift-h = 'move left'
ctrl-shift-j = 'move down'
ctrl-shift-k = 'move up'
ctrl-shift-l = 'move right'

# Workspace switching. PRIMARY monitor (workspaces 1-10) on cmd-1..0;
# EXTERNAL/BenQ monitor (workspaces 11-20) on ctrl-1..0. Pinning is done in
# [workspace-to-monitor-force-assignment] at the bottom of this file, so
# focusing e.g. ws 11 also shifts focus to the external monitor.
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'
cmd-0 = 'workspace 10'

ctrl-1 = 'workspace 11'
ctrl-2 = 'workspace 12'
ctrl-3 = 'workspace 13'
ctrl-4 = 'workspace 14'
ctrl-5 = 'workspace 15'
ctrl-6 = 'workspace 16'
ctrl-7 = 'workspace 17'
ctrl-8 = 'workspace 18'
ctrl-9 = 'workspace 19'
ctrl-0 = 'workspace 20'

# Move window to workspace. Mirrors the switch bindings above: PRIMARY
# monitor (ws 1-10) on cmd-shift-1..0, EXTERNAL/BenQ (ws 11-20) on
# ctrl-shift-1..0. --focus-follows-window so you land on the destination
# workspace (and its monitor) with the window, instead of being left behind
# on the source. These are numbers; ctrl-shift-hjkl (in-tree move) are
# letters, so the two ctrl-shift groups don't collide.
cmd-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
cmd-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
cmd-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
cmd-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
cmd-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
cmd-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
cmd-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
cmd-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
cmd-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'
cmd-shift-0 = 'move-node-to-workspace 10 --focus-follows-window'

ctrl-shift-1 = 'move-node-to-workspace 11 --focus-follows-window'
ctrl-shift-2 = 'move-node-to-workspace 12 --focus-follows-window'
ctrl-shift-3 = 'move-node-to-workspace 13 --focus-follows-window'
ctrl-shift-4 = 'move-node-to-workspace 14 --focus-follows-window'
ctrl-shift-5 = 'move-node-to-workspace 15 --focus-follows-window'
ctrl-shift-6 = 'move-node-to-workspace 16 --focus-follows-window'
ctrl-shift-7 = 'move-node-to-workspace 17 --focus-follows-window'
ctrl-shift-8 = 'move-node-to-workspace 18 --focus-follows-window'
ctrl-shift-9 = 'move-node-to-workspace 19 --focus-follows-window'
ctrl-shift-0 = 'move-node-to-workspace 20 --focus-follows-window'

# Window management (was super-q/m/f in Hyprland)
cmd-q = 'close'
cmd-f = 'layout floating tiling'
cmd-m = 'fullscreen'

# Switch windows within a workspace without dropping out of fullscreen.
# Plain 'fullscreen' un-sets itself the moment focus moves to a different
# window, so a bare focus change lands you back on the tiled layout
# underneath -- this re-applies fullscreen to whichever window you land on.
# Deliberately overrides macOS's global Cmd+Tab app switcher (accepted
# tradeoff, same category as the cmd-q/cmd-m/cmd-f/cmd-h overrides above);
# alt-tab above is the separate "just cycle, keep whatever layout" binding.
cmd-tab = ['focus dfs-next --wrap-around', 'fullscreen on']
cmd-shift-tab = ['focus dfs-prev --wrap-around', 'fullscreen on']

# Resize -- NEW, no Hyprland source equivalent (it used mouse-drag, which
# doesn't map to a keyboard-driven tiling WM model)
cmd-minus = 'resize smart -50'
cmd-equal = 'resize smart +50'

# Layout / split direction toggle -- NEW, no explicit Hyprland source
# binding (dwindle auto-splits), but AeroSpace needs at least one of
# these bound to be usable
cmd-slash = 'layout tiles horizontal vertical'
cmd-comma = 'layout accordion horizontal vertical'

# Cycle through a window stack in tree order -- more reliable than
# directional focus (cmd-hjkl) once an accordion stack is 3+ windows deep,
# since geometric left/right hit-testing gets ambiguous on overlapping
# windows. alt is otherwise unused in this config, so no conflict (unlike
# cmd-tab, which is macOS's global app switcher).
alt-tab = 'focus dfs-next --wrap-around'
alt-shift-tab = 'focus dfs-prev --wrap-around'

# Reload config (was super-r in Hyprland, which also restarted other
# Wayland services that have no macOS equivalent -- just the config here)
cmd-shift-r = 'reload-config'

# App launchers (was super-return/b/t/d/o/e in Hyprland)
cmd-enter = 'exec-and-forget open -a Ghostty'
cmd-b = 'exec-and-forget open -a Zen'
# cmd-t = 'exec-and-forget open -a Ghostty -n --args -e btop'
# cmd-d = 'exec-and-forget open -a Ghostty -n --args -e lazydocker'
# cmd-o = 'exec-and-forget open -a Obsidian'
cmd-e = 'exec-and-forget open -a Finder'

# Dual-monitor pinning: PRIMARY (built-in) monitor gets workspaces 1-10,
# the EXTERNAL BenQ gets 11-20 -- the same split the laptop's Hyprland config
# used (eDP-1 = 1-10, external = 11-20). Values are case-insensitive substring
# matches against the monitor name from `aerospace list-monitors`
# ('Built-in Retina Display' and 'BenQ GW2283' on this machine). When the BenQ
# is unplugged AeroSpace collapses 11-20 onto the remaining monitor, and
# restores them on reconnect -- no extra handling needed.
[workspace-to-monitor-force-assignment]
1 = 'built-in'
2 = 'built-in'
3 = 'built-in'
4 = 'built-in'
5 = 'built-in'
6 = 'built-in'
7 = 'built-in'
8 = 'built-in'
9 = 'built-in'
10 = 'built-in'
11 = 'BenQ'
12 = 'BenQ'
13 = 'BenQ'
14 = 'BenQ'
15 = 'BenQ'
16 = 'BenQ'
17 = 'BenQ'
18 = 'BenQ'
19 = 'BenQ'
20 = 'BenQ'

# App-to-workspace pinning: either terminal (Ghostty or WezTerm) always
# lands on workspace 1, Zen always on workspace 2, regardless of which
# workspace was focused when it opened. Bundle IDs looked up via:
# osascript -e 'id of app "Ghostty"' / '"WezTerm"' / '"Zen"'.
# For any other app, use the same lookup (or mdls -name
# kMDItemCFBundleIdentifier /Applications/<App>.app) and add a block below.
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = 'move-node-to-workspace 2'
