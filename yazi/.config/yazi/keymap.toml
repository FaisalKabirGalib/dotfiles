# === Plugins ===

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter dir or open file"

[[mgr.prepend_keymap]]
on   = "p"
run  = "plugin smart-paste"
desc = "Paste into hovered dir or CWD"

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore preview pane"

[[mgr.prepend_keymap]]
on   = [ "m", "p" ]
run  = "plugin toggle-pane min-preview"
desc = "Show or hide preview pane"

[[mgr.prepend_keymap]]
on   = [ "m", "c" ]
run  = "plugin toggle-pane min-current"
desc = "Show or hide current pane"

[[mgr.prepend_keymap]]
on   = [ "m", "a" ]
run  = "plugin toggle-pane reset"
desc = "Reset panes to configured ratio"

# === Bookmarks (g-prefix) ===

[[mgr.prepend_keymap]]
on   = [ "g", "h" ]
run  = "cd ~"
desc = "Cd to ~"

[[mgr.prepend_keymap]]
on   = [ "g", "d" ]
run  = "cd ~/Downloads"
desc = "Cd to ~/Downloads"

[[mgr.prepend_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/Documents"
desc = "Cd to ~/Documents"

[[mgr.prepend_keymap]]
on   = [ "g", "c" ]
run  = "cd ~/.config"
desc = "Cd to ~/.config"

[[mgr.prepend_keymap]]
on   = [ "g", "o" ]
run  = "cd ~/dotfiles"
desc = "Cd to ~/dotfiles"

# === System clipboard (macOS) ===

[[mgr.prepend_keymap]]
on   = [ "y", "p" ]
run  = 'shell -- echo -n "%h" | pbcopy'
desc = "Copy hovered path to clipboard"

[[mgr.prepend_keymap]]
on   = [ "y", "d" ]
run  = 'shell -- echo -n "$(dirname "%h")" | pbcopy'
desc = "Copy hovered dirname to clipboard"

# === Flat view (fd) ===

[[mgr.prepend_keymap]]
on   = [ "g", "f" ]
run  = 'search_do --via=fd --args="-d 3"'
desc = "Flat view (fd depth 3)"
