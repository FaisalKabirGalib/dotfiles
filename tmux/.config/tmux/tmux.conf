# Terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g allow-passthrough on   # let Kitty/sixel graphics (e.g. chafa previews) reach Ghostty
set -ga terminal-features "*:sixel"   # tmux renders sixel natively (chafa previews survive repaints)

# Prefix
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Options
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g set-clipboard on
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u
setw -g mode-keys vi

# Copy-mode: enter manually to scroll/copy even inside TUI apps
bind u copy-mode
bind -T copy-mode-vi C-u send-keys -X half-page-up
bind -T copy-mode-vi C-d send-keys -X half-page-down
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Pane splitting
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Pane zoom
bind -r m resize-pane -Z

# Pane resize (vim keys)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Status position
set -g status-position top

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'fabioluciano/tmux-powerkit'

# Resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Continuum
set -g @continuum-restore 'on'

# Sessionx
set -g @sessionx-bind 's'
set -g @sessionx-x-path '~/dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-filter-current 'false'
set -g @sessionx-bind-zo-new-window 'ctrl-y'

# Floax
set -g @floax-bind 'p'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-change-path 'true'

# Powerkit - Status bar framework
# Per-pane context (git/cwd/uptime/hostname); system metrics live in waybar instead
set -g @powerkit_plugins "git,uptime,hostname"
set -g @powerkit_theme "catppuccin"
set -g @powerkit_theme_variant "macchiato"
set -g @powerkit_separator_style "flame"
set -g @powerkit_status_order "session,plugins"
set -g @powerkit_status_interval "5"

# Initialize TPM
run '~/.config/tmux/plugins/tpm/tpm'
