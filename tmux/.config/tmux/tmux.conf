# Terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g allow-passthrough on   # let graphics protocols reach Ghostty

# Transparency: leave pane cells at the terminal default background so
# Ghostty's `background-opacity` shows through. Omarchy's theme sync
# (omarchy-theme-set-tmux) sets an opaque `bg=` from the theme's colors.toml,
# which paints over it — the theme-set.d/tmux-transparency.hook undoes that.
set -g window-style default
set -g window-active-style default

# Prefix
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Options
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g set-clipboard on
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
setw -g mode-keys vi

# Copy-mode: enter manually to scroll/copy even inside TUI apps
bind u copy-mode
bind -T copy-mode-vi C-u send-keys -X half-page-up
bind -T copy-mode-vi C-d send-keys -X half-page-down
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Pane splitting
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Pane zoom
bind -r m resize-pane -Z

# Pane resize (arrows)
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5

# Status position
set -g status-position top

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @plugin 'samleeney/tmux-agent-status'

# Resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Continuum
set -g @continuum-restore 'on'

# Sessionx
set -g @sessionx-bind 's'
set -g @sessionx-x-path '~/dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-filter-current 'false'
set -g @sessionx-bind-zo-new-window 'ctrl-y'

# Floax
set -g @floax-bind 'p'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-change-path 'true'

# Powerkit - Status bar framework
# Per-pane context (git/cwd/uptime/hostname); system metrics live in Omarchy's bar
set -g @powerkit_plugins "git,uptime,hostname"
set -g @powerkit_theme "custom"
set -g @powerkit_custom_theme_path "~/.cache/tmux-powerkit/omarchy-theme.sh"
set -g @powerkit_separator_style "flame"
set -g @powerkit_status_order "session,plugins"
set -g @powerkit_status_interval "5"

# Agent status — hook-based, precise state tracking for Claude Code and Codex.
# Existing tmux bindings stay intact: the sidebar uses prefix + a, while the
# switcher and queue controls use uppercase keys.
set -g @agent-status-key "S"
set -g @agent-sidebar-key "a"
set -g @agent-next-done-key "N"
set -g @agent-wait-key "W"
set -g @agent-park-key "P"
set -g @agent-switcher-style "both"
set -g @agent-switcher-default-mode "agents"
set -g @agent-sidebar-width "38"

# Initialize TPM
run '~/.config/tmux/plugins/tpm/tpm'

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
